name: FindMeApartment Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: fma_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Steirly Isolated Monolith Tests
      env:
        DB_ENGINE: django.db.backends.mysql
        DB_NAME: fma_test_db
        DB_USER: root
        DB_PASSWORD: root_test_password
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        SECRET_KEY: test_secret_key_for_ci_pipeline
        DEBUG: False
      run: |
        python manage.py test
