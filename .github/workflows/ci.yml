name: FindMeApartment Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  TZ: 'Europe/Berlin'

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: fma_test_db
          TZ: 'Europe/Berlin'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Missing Logs Directory
      run: |
        mkdir -p logs

    - name: Check Missing Migrations Guardrail
      env:
        DB_URL: mysql://root:root_test_password@127.0.0.1:3306/fma_test_db
        SECRET_KEY: test_secret_key_for_ci_pipeline
        AWS_ACCESS_KEY_ID: ci_mock_key_id
        AWS_SECRET_ACCESS_KEY: ci_mock_secret_key
        AWS_STORAGE_BUCKET_NAME: fma-server-bucket
        AWS_S3_REGION_NAME: eu-north-1
        DEBUG: "False"
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Strictly Isolated Monolith Tests
      env:
        DB_URL: mysql://root:root_test_password@127.0.0.1:3306/fma_test_db
        SECRET_KEY: test_secret_key_for_ci_pipeline
        AWS_ACCESS_KEY_ID: ci_mock_key_id
        AWS_SECRET_ACCESS_KEY: ci_mock_secret_key
        AWS_STORAGE_BUCKET_NAME: fma-server-bucket
        AWS_S3_REGION_NAME: eu-north-1
        DEBUG: False
      run: |
        python manage.py test

  frontend-validation:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd frontend && npm run typecheck

      - name: Run Production Bundle Build
        run: |
          cd frontend && npm run build