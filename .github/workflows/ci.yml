name: FindMeApartment Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  beckend-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: fma_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Missing Migrations Guardrail
      env:
        DB_URL: mysql://root:root_test_password@127.0.0.1:3306/fma_test_db
        SECRET_KEY: test_secret_key_for_ci_pipeline
        AWS_ACCESS_KEY_ID: ci_mock_key_id
        AWS_SECRET_ACCESS_KEY: ci_mock_secret_key
        AWS_STORAGE_BUCKET_NAME: fma-server-bucket
        DEBUG: "False"
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Steirly Isolated Monolith Tests
      env:
        DB_URL: mysql://root:root_test_password@127.0.0.1:3306/fma_test_db
        SECRET_KEY: test_secret_key_for_ci_pipeline
        DEBUG: False
      run: |
        python manage.py test
