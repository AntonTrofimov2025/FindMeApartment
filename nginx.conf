events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # 1. Раздача статики (Nginx отдает сам напрямую)
        location /static/ {
            alias /fma/static/;
        }

         # 2. Раздача медиа (аватары, фото жилья)
        location /media/ {
            alias /fma/media/;  # Путь к медиа внутри контейнера Nginx
        }

        # 3. Защита эндпоинта ping от внешнего мира
        location /ping/ {
            return 404;
        }

        # 4. Проксирование запросов в Gunicorn
        location ~ ^/(api|admin)/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Для поддержки HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Всё остальное отправляем в контейнер React-фронтенда!
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
