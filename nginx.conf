events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name localhost;

        # 1. Раздача статики (Nginx отдает сам напрямую)
        location /static/ {
            alias /fma/static/;
        }

        # 2. Защита эндпоинта ping от внешнего мира
        location /ping/ {
            deny all;

            # Маскируем ошибку 403 (Доступ запрещен) под обычную 404
            error_page 403 =404 /404.html;
        }

        # 3. Проксирование запросов в Gunicorn
        location / {
            proxy_pass http://fma_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
